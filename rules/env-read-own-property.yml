  `readEnv` returns the value only for an own property and `undefined`
  otherwise. The same defect was fixed three times. A key that is a string
  literal needs no reader.
files:
  - plugins/**/*.ts
  - examples/plugins/**/*.ts
  - examples/distribution/**/*.ts
  - tests/helpers/plugins/**/*.ts
rule:
  kind: subscript_expression
  all:
    - has:
        field: object
        regex: ^(?:[\w$.]+\.)?(?:env|\w*Env)$
    - not:
        has:
          field: index
          any:
            - kind: string
            - kind: number
    # Not a write or a delete: nothing inherited comes back.
