# Shipped code builds no regex with a lookbehind (`(?<=` or `(?<!`). The bun
# this repo pins (.bun-version) cannot compile a lookbehind to native code, so
# the whole pattern runs in the regex interpreter, about ten times slower.
# yak-redact.ts scans agent-authored text of any length on every submission;
# one lookbehind on ASSIGNMENT_RE took the 200KB pathological-input test from
# about 90ms to about 900ms on that bun, and past its budget in CI. A newer bun
# compiles the same pattern natively, so a local run did not show it.
#
# Matches a lookbehind in a regex literal, or in a string or template literal
# (the source handed to `new RegExp`).
id: regex-no-lookbehind
language: typescript
severity: error
message: >-
  A regex lookbehind here makes the pinned bun interpret the whole pattern,
  about ten times slower on long input. Check the preceding text in code (the
  replace callback has the offset and the full string) or anchor a lookahead
  at an earlier position instead.
note: |
  Probe: a `\b…\b` name pattern over "a-".repeat(100000) runs in ~22ms on
  the pinned bun, and in ~195ms once `(?<=…)` is added anywhere in it.
files:
  - src/**/*.ts
  - ts/**/*.ts
  - plugins/**/*.ts
rule:
  any:
    - kind: regex_pattern
      regex: \(\?<[=!]
    - kind: string_fragment
      regex: \(\?<[=!]
