name: ci

# Every gate a change must pass. The jobs are independent (no `needs:`), so one
# red gate never hides another. No job reads a secret.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned because each tool's output is what its gate reads: an unpinned tool
  # makes "the code changed" and "the tool changed" the same red X. Each
  # download is checked against the sha256 of that exact release asset, so a
  # version bump changes its checksum in the same edit. bun's version comes from
  # .bun-version.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 # shellcheck-v0.11.0.linux.x86_64.tar.xz
  ASTGREP_VERSION: 0.39.9
  ASTGREP_SHA256: ef0f01cd410bf4dafaa2877d592bc5ee0c0978f9a0854a4633ed6082a48963c6 # app-x86_64-unknown-linux-gnu.zip

defaults:
  run:
    # bash with pipefail; the default `run:` shell has no pipefail.
    shell: bash

jobs:
  bun:
    name: bun (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The suite fails rather than skips when a tool it gates on is absent
      # (tests/required-tools.txt): zsh for completion, script for the TTY rows.
      - name: Install zsh and script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh util-linux
          zsh --version
          command -v script

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test ./tests

  binary-oracle:
    name: binary oracle (build + bun test, ERIS_BIN)
    runs-on: ubuntu-latest
    # A hung suite never fails on its own; the timeout makes it red.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install zsh and script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh util-linux
          zsh --version
          command -v script

      - run: bun install --frozen-lockfile

      # scripts/build.ts prints the output path; this host is linux-x64.
      - name: Build the binary
        id: build
        run: |
          bin=$(bun scripts/build.ts)
          [[ "$bin" == dist/eris-linux-x64 ]] || { echo "::error title=Wrong platform::built $bin, expected dist/eris-linux-x64"; exit 1; }
          echo "bin=$PWD/$bin" >>"$GITHUB_OUTPUT"

      # The same suite drives the binary; the tests about the checkout itself
      # skip with a named reason.
      - name: bun test (ERIS_BIN = the binary)
        env:
          ERIS_BIN: ${{ steps.build.outputs.bin }}
        run: bun test ./tests

  ast-grep:
    name: ast-grep (scan + rule tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install ast-grep ${{ env.ASTGREP_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${ASTGREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${ASTGREP_SHA256}  $RUNNER_TEMP/ast-grep.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          sudo install "$RUNNER_TEMP/ast-grep/ast-grep" /usr/local/bin/ast-grep
          ast-grep --version

      # sgconfig.yml: rules/ at error severity, with its cases in rule-tests/.
      - run: ast-grep scan
      - run: ast-grep test --skip-snapshot-tests

  shellcheck:
    name: shellcheck (-S warning, zero findings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # The POSIX shim, checked as sh: consumers run it under sh, dash and bash
      # alike.
      - run: shellcheck -s sh -S warning eris

  scrub:
    name: scrub-check (no private references, whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The full history: on a pull request HEAD is the merge commit, and
      # --history scans every blob and message reachable from it, both
      # parents included. It refuses a shallow clone rather than scan a cut one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun scripts/scrub-check.ts --history

  npm-pack:
    name: npm package (pack, dry-run publish, install, run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The tarball npm would publish, and npm's own check that it can: a dry run
      # uploads nothing and needs no token. --ignore-scripts, so no repo script runs.
      - name: Pack and dry-run publish
        id: pack
        run: |
          tarball=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          echo "tarball=$RUNNER_TEMP/$tarball" >>"$GITHUB_OUTPUT"
          npm publish --dry-run --ignore-scripts

      # An install from the tarball alone, run from a directory with no checkout
      # in it. The command's shebang is `env -S bun ...`, which needs GNU env 8.30
      # or newer (printed below) and macOS's env; this job is the Linux half.
      - name: npm install -g, then eris --help
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          env --version | sed -n 1p
          mkdir -p "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/npm-prefix" "$TARBALL"
          out=$("$RUNNER_TEMP/npm-prefix/bin/eris" --help)
          [[ "$out" == "Usage: eris "* ]] || { echo "::error title=npm install -g::eris --help printed: $out"; exit 1; }

      - name: bun add -g, then eris --help
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          export BUN_INSTALL="$RUNNER_TEMP/bun"
          cd "$RUNNER_TEMP/clean"
          bun add --global "$TARBALL"
          out=$("$BUN_INSTALL/bin/eris" --help)
          [[ "$out" == "Usage: eris "* ]] || { echo "::error title=bun add -g::eris --help printed: $out"; exit 1; }

      # Run from a directory whose bunfig.toml preloads a script, each installed
      # command must not run it. A bare `bun` in the same directory does, which is
      # what makes the silence mean something.
      - name: The installed commands read nothing from their cwd
        run: |
          svc="$RUNNER_TEMP/svc"
          mkdir -p "$svc" && cd "$svc"
          echo 'require("node:fs").appendFileSync("preload-ran", "x");' >pwn.ts
          echo 'preload = ["./pwn.ts"]' >bunfig.toml
          bun --eval 0
          [[ -f preload-ran ]] || { echo "::error title=Control failed::a bare bun did not run the preload, so this step proves nothing"; exit 1; }
          rm preload-ran
          for bin in "$RUNNER_TEMP/npm-prefix/bin/eris" "$RUNNER_TEMP/bun/bin/eris"; do
            "$bin" --version
            [[ ! -e preload-ran ]] || { echo "::error title=cwd read::$bin ran the cwd's bunfig preload"; exit 1; }
          done

      # A repository that declares the dependency under the key `eris` imports the
      # package's subpaths by that name, whatever the package is published as.
      - name: A consumer under the key eris resolves eris/sdk, eris/yak-contract and eris/yak-redact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          app="$RUNNER_TEMP/consumer"
          mkdir -p "$app" && cd "$app"
          printf '{"name":"consumer","private":true,"type":"module","dependencies":{"eris":"file:%s"}}\n' "$TARBALL" >package.json
          bun install
          cat >check.ts <<'TS'
          import { runProgram } from "eris/sdk";
          import { YAKS_CONTRACT_VERSION } from "eris/yak-contract";
          import { redactDeep } from "eris/yak-redact";
          if (typeof runProgram !== "function" || YAKS_CONTRACT_VERSION !== "2.0.0") throw new Error("eris/sdk or eris/yak-contract did not resolve");
          if (redactDeep({ token: "ghp" + "_" + "a".repeat(36) }).total !== 1) throw new Error("eris/yak-redact did not resolve");
          console.log("resolved eris/sdk, eris/yak-contract and eris/yak-redact", YAKS_CONTRACT_VERSION);
          TS
          bun check.ts
