# .claude/surfaces.yml
#
# Tier-1 surfaces for the per-PR surface-conformance check. A change touching
# one of these paths is graded against the surface's pattern classes.

surfaces:
  secrets:
    paths:
      - packages/outbound-scan/**
      - plugins/yak/yak-submit.ts
      - plugins/socrates/submit.ts
      - scripts/vendor-gitleaks.ts
      - tests/yak-redact.test.ts
      - tests/outbound-scan.test.ts
    class_taxonomy: docs/dev/surfaces/secrets.md
    description: |
      Client-side secret scanning and redaction for `eris yak` and `eris
      socrates`. It is the only scrub that agent-authored text gets before it
      is persisted server-side and posted publicly, so a miss ships a
      credential to a place it cannot be recalled from.
      packages/outbound-scan holds the redaction pipeline (redact.ts), the
      vendored gitleaks rules and the scan that refuses on them (scan.ts);
      yak-submit.ts and socrates/submit.ts are the call sites; the test files
      pin each class and each secret shape.
