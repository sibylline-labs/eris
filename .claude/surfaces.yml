# .claude/surfaces.yml
#
# Tier-1 surfaces for the per-PR surface-conformance check. A change touching
# one of these paths is graded against the surface's pattern classes.

surfaces:
  secrets:
    paths:
      - packages/outbound-scan/**
      - src/runtime/credentials.ts
      - plugins/yak/yak.ts
      - plugins/yak/yak-admin.ts
      - plugins/yak/tokens.ts
      - plugins/yak/org.ts
      - plugins/yak/yak-submit.ts
      - plugins/yak/yak-reports.ts
      - plugins/yak/whoami.ts
      - plugins/yak/handlers.ts
      - plugins/yak/login.ts
      - plugins/socrates/submit.ts
      - plugins/socrates/client.ts
      - plugins/socrates/resolve.ts
      - plugins/socrates/discover.ts
      - plugins/socrates/consult.ts
      - plugins/socrates/settings.ts
      - plugins/socrates/settings-panels.ts
      - packages/gates-contract/src/client.ts
      - plugins/doctrine/pull.ts
      - plugins/doctrine/push.ts
      - plugins/doctrine/set.ts
      - plugins/gate/store.ts
      - plugins/gate/ci-verb.ts
      - scripts/vendor-gitleaks.ts
      - tests/yak-redact.test.ts
      - tests/tokens.test.ts
      - tests/outbound-scan.test.ts
      - tests/org.test.ts
      - tests/org-send-sites.test.ts
      - tests/org-send-sites-admin.test.ts
      - tests/login.test.ts
      - tests/yak-reports.test.ts
      - tests/doctrine-pull.test.ts
      - tests/doctrine-push.test.ts
      - tests/doctrine-set.test.ts
      - tests/doctrine-push-set-e2e.test.ts
      - tests/gates-client-receipts.test.ts
      - tests/gate-verbs.test.ts
      - tests/gate-ci.test.ts
    class_taxonomy: docs/dev/surfaces/secrets.md
    description: |
      Client-side secret scanning and redaction for `eris yak` and `eris
      socrates`. It is the only scrub that agent-authored text gets before it
      is persisted server-side and posted publicly, so a miss ships a
      credential to a place it cannot be recalled from.
      packages/outbound-scan holds the redaction pipeline (redact.ts), the
      vendored gitleaks rules and the scan that refuses on them (scan.ts);
      yak-submit.ts, yak-reports.ts and socrates/submit.ts, resolve.ts, consult.ts, settings.ts and settings-panels.ts are the call sites,
      credentials.ts resolves the bearer and the URL it may go to, and
      yak.ts, yak-admin.ts, org.ts, whoami.ts and client.ts carry it, handlers.ts
      forwards the caller's directory the bearer is resolved from, login.ts
      receives the bearer and writes it to yaks.json, as do the gates
      client (packages/gates-contract/src/client.ts, which also refuses a
      non-https, non-loopback URL), doctrine/pull.ts, doctrine/push.ts and doctrine/set.ts (the same bearer, over PUT and POST) and gate/store.ts, gate/ci-verb.ts (which carries
      the bearer GET-only: `eris gate ci` builds its one endpoint on a fetch
      that refuses any other method before the network), tokens.ts mints and prints a service token's secret once, discover.ts strips a remote url's
      credentials before keeping it; the test files
      pin each class and each secret shape.
