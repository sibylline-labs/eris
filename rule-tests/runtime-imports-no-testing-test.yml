id: runtime-imports-no-testing
valid:
  - import { runMany } from "../runtime/process";
  - import { definePlugin } from "../../src/cli/plugin";
  - import { z } from "zod";
  # The SDK itself, and a path under it that is not the testing subpath.
  - import { definePlugin } from "eris/sdk";
  - import x from "eris/sdk/testing-utils";
  - import y from "eris/sdk/testing/extra";
  - import z from "my-eris/sdk/testing";
  # A plugin's own folder of that name is the plugin's.
  - import { helper } from "./testing/helper";
  - const run = (await import("./handlers")).runDemo;
invalid:
  - import { createFakeRunner } from "eris/sdk/testing";
  - import { buildInChild } from 'eris/sdk/testing';
  - export * from "eris/sdk/testing";
  - const t = await import("eris/sdk/testing");
  - const t = await import(`eris/sdk/testing`);
  - const t = require("eris/sdk/testing");
