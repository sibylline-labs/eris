id: runtime-imports-no-testing-depth-3
# A file two directories down (src/cli/commands/x.ts, plugins/yak/lib/x.ts):
# three climbs reach the repo root.
valid:
  # Two climbs land inside the tree.
  - import { helper } from "../../testing/helper";
  - const t = await import("../../testing");
  # Four climbs leave the repository.
  - import { createFakeRunner } from "../../../../testing";
  - import { helper } from "./testing/helper";
  - import x from "../../../testing-utils";
invalid:
  - import { createFakeRunner } from "../../../testing";
  - import { buildInChild } from "../../../testing/build-child";
  - export * from "../../../testing";
  - const t = await import("../../../testing");
  - const t = await import(`../../../testing/index`);
  - const t = require("../../../testing");
